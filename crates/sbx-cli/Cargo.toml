[package]
name = "sbx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entrypoint for AI Sandbox (sbx)"

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
sbx-proto = { path = "../sbx-proto" }
sbx-containerd = { path = "../sbx-containerd" }
sbx-runtime = { path = "../sbx-runtime" }
sbx-net = { path = "../sbx-net" }
sbx-daemon = { path = "../sbx-daemon" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
