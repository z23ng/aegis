[package]
name = "sbx-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "containerd-shim-sbx-v2 Runtime v2 shim (Milestone 3)"

[[bin]]
name = "containerd-shim-sbx-v2"
path = "src/main.rs"

[dependencies]
sbx-proto = { path = "../sbx-proto" }
sbx-containerd = { path = "../sbx-containerd" }
sbx-runtime = { path = "../sbx-runtime" }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
