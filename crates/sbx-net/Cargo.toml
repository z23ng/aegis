[package]
name = "sbx-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-trust egress proxy and network namespace isolation (Milestone 2)"

[dependencies]
sbx-proto = { path = "../sbx-proto" }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
