[workspace]
resolver = "2"
members = [
    "crates/sbx-proto",
    "crates/sbx-guest-agent",
    "crates/sbx-containerd",
    "crates/sbx-runtime",
    "crates/sbx-cli",
    "crates/sbx-shim",
    "crates/sbx-net",
    "crates/sbx-daemon",
    "crates/sbx-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
